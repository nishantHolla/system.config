[mgr]
sort_by = "natural"

# Images
[[opener.image]]
run = '$IMAGE_VIEWER %s'
orphan = true
desc = "Image viewer"
for = "unix"

# Videos
[[opener.video]]
run = '$VIDEO_VIEWER %s'
orphan = true
desc = "Video player"
for = "unix"

# PDFs
[[opener.pdf]]
run = '$PDF_VIEWER %s'
orphan = true
desc = "PDF viewer"
for = "unix"

# Documents
[[opener.word]]
run = '$WORD_EDITOR %s'
orphan = true
desc = "Word editor"
for = "unix"

# Presentations
[[opener.presentation]]
run = '$PRESENTATION_EDITOR %s'
orphan = true
desc = "Presentation editor"
for = "unix"

# Spreadsheets
[[opener.spreadsheet]]
run = '$SPREADSHEET_EDITOR %s'
orphan = true
desc = "Spreadsheet editor"
for = "unix"

# Fallback
[[opener.edit]]
run = '$EDITOR %s'
block = true
desc = "Editor"
for = "unix"

[[open.prepend_rules]]
url = "*.{jpg,jpeg,png,webp,gif,ppm}"
use = "image"

[[open.prepend_rules]]
url = "*.{mp4,mpg,mkv}"
use = "video"

[[open.prepend_rules]]
url = "*.pdf"
use = "pdf"

[[open.prepend_rules]]
url = "*.{doc,docx,odt}"
use = "word"

[[open.prepend_rules]]
url = "*.{ppt,pptx}"
use = "presentation"

[[open.prepend_rules]]
url = "*.{xls,xlsx,ods}"
use = "spreadsheet"

[[open.append_rules]]
url = "*"
use = "edit"
